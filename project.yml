name: CustomMapApp
options:
  bundleIdPrefix: com.gabrielconlon
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "3ED9V77D6W"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CustomMapApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BetterMaps
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: BetterMaps/Info.plist
        CODE_SIGN_ENTITLEMENTS: BetterMaps/BetterMaps.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielconlon.CustomMapApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CustomMapAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BetterMaps-Tests
    dependencies:
      - target: CustomMapApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielconlon.CustomMapAppTests

  CustomMapAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BetterMaps-UITests
    dependencies:
      - target: CustomMapApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielconlon.CustomMapAppUITests
        TEST_TARGET_NAME: CustomMapApp

schemes:
  CustomMapApp:
    build:
      targets:
        CustomMapApp: all
        CustomMapAppTests: [test]
        CustomMapAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CustomMapAppTests
        - CustomMapAppUITests
