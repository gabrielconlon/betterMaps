name: CustomMapApp
options:
  bundleIdPrefix: com.gabrielconlon
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CustomMapApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CustomMapApp
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: SwiftProtobuf
    settings:
      base:
        INFOPLIST_FILE: CustomMapApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: CustomMapApp/CustomMapApp.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielconlon.CustomMapApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
