name: CustomMapApp
options:
  bundleIdPrefix: com.gabrielconlon
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    # Placeholder: scripts/release.sh passes the git commit count, so uploads
    # always climb. Edit MARKETING_VERSION by hand; never this. See docs/RELEASE.md.
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "3ED9V77D6W"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  CustomMapApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BetterMaps
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: BetterMaps/Info.plist
        CODE_SIGN_ENTITLEMENTS: BetterMaps/BetterMaps.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielconlon.CustomMapApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Mac Catalyst: the same target builds the Mac app. It keeps the iOS
        # bundle ID (no "maccatalyst." prefix) so App Store Connect treats it as
        # one app on two platforms (universal purchase) and both talk to the same
        # CloudKit container. Device family 1,2 is "Scale Interface to Match
        # iPad": the Mac gets the iPad layout. See docs/RELEASE.md, "The Mac app".
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BetterMaps/BetterMaps-macOS.entitlements

  CustomMapAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BetterMaps-Tests
    dependencies:
      - target: CustomMapApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielconlon.CustomMapAppTests
        # So the unit tests also run hosted in the Mac build.
        SUPPORTS_MACCATALYST: YES

  CustomMapAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BetterMaps-UITests
    dependencies:
      - target: CustomMapApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gabrielconlon.CustomMapAppUITests
        TEST_TARGET_NAME: CustomMapApp

schemes:
  CustomMapApp:
    build:
      targets:
        CustomMapApp: all
        CustomMapAppTests: [test]
        CustomMapAppUITests: [test]
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - CustomMapAppTests
        - CustomMapAppUITests
